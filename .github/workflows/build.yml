name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - run: pip install -r requirements-build.txt
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: GoProAutoSlow-${{ matrix.os }}
          path: |
            dist/GoProAutoSlow.exe
            dist/GoProAutoSlow-Setup.exe
            dist/GoProAutoSlow-macos.zip
            dist/GoProAutoSlow.dmg
